name: ci-tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend tests
        run: |
          python -m pip install --upgrade pip
          echo "running backend smoke"
          python - << 'PY'
from pathlib import Path
print('OK backend smoke')
PY
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend tests
        run: |
          npm -v
          node -e "console.log('OK frontend smoke')"
